name: Check

on:
  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  python-syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall addon/i3dio
